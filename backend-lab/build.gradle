plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}
version = '0.3.2-lab'
evaluationDependsOn(':kernel')
evaluationDependsOn(':backend-numen')
evaluationDependsOn(':backend-api')
if(providers.gradleProperty('backendHost').isPresent()) evaluationDependsOn(':mod')
dependencies {
    implementation project(':backend-numen')
    if(providers.gradleProperty('backendHost').isPresent()) compileOnly project(':mod')
}
neoForge {
    version = '21.1.249'
    runs {
        gameTestServer {
            type = 'gameTestServer'
            def runId = providers.gradleProperty('backendRunId').get()
            if (!(runId ==~ /[A-Za-z0-9-]{1,64}/)) throw new GradleException('Invalid isolated run id')
            def runDir = rootProject.file(".runtime/backend-v03/runs/${runId}")
            if (runDir.exists()) throw new GradleException('Choose a fresh backendRunId; old evidence must not be overwritten')
            gameDirectory = runDir
            def suite = providers.gradleProperty('backendSuite').getOrElse('base')
            if (!(suite in ['recovery032', 'recoveryfinal', 'recoveryedge', 'recovery', 'base', 'contracts', 'limits-candidate', 'limits-door', 'limits-output', 'lifecycle', 'excavation', 'journal', 'safety', 'preparation', 'preparation-empty', 'containers', 'orders', 'host', 'navigation', 'processing', 'compare-legacy', 'compare-numen', 'autonomy'])) throw new GradleException('Unknown backend suite')
            systemProperty 'neoforge.enabledGameTestNamespaces', suite.startsWith('compare-') ? 'hearthcrew_backend_comparison' : suite == 'base' ? 'hearthcrew_backend_lab' : suite == 'preparation' ? 'hearthcrew_backend_preparation,hearthcrew_backend_preparation_empty' : "hearthcrew_backend_${suite.replace('-', '_')}"
            systemProperty 'hearthcrew.backendLab', 'true'
            if(suite=='host'||suite.startsWith('compare-')||suite=='autonomy'){
                if(!providers.gradleProperty('backendHost').isPresent())throw new GradleException('Host tests require backendHost')
                systemProperty 'hearthcrew.executionBackend',suite=='compare-legacy'?'legacy':'numen'
                systemProperty 'hearthcrew.isolatedGameTest','true'
            }
            if(suite=='autonomy'){
                def control=providers.gradleProperty('lunaControlDirectory').get()
                if(!rootProject.file("${control}/authorization.json").isFile())throw new GradleException('Bounded Luna authorization missing')
                systemProperty 'hearthcrew.realLunaApproved','true'
                systemProperty 'hearthcrew.lunaControlDirectory',control
                systemProperty 'hearthcrew.pairing',"${control}/pairing.json"
            }
        }
    }
    mods {
        hearthcrew_backend_lab { if(providers.gradleProperty('backendHost').isPresent())sourceSet project(':mod').sourceSets.main; sourceSet project(':kernel').sourceSets.main; sourceSet project(':backend-api').sourceSets.main; sourceSet project(':backend-numen').sourceSets.main; sourceSet sourceSets.main }
    }
}
tasks.named('jar') { archiveBaseName = 'hearthcrew-backend-lab-NOT-FOR-INSTALL' }

if(!providers.gradleProperty('backendHost').isPresent())sourceSets.main.java.exclude('**/runtime/BackendHostTests.java','**/runtime/BackendComparisonTests.java','**/runtime/BackendAutonomyTests.java')

// One Java module: the API and host intentionally share packages. Both @Mod entrypoints
// are declared in this isolated combined descriptor; gameplay packaging is a separate gate.
tasks.named('processResources') {
    inputs.property('backendHost',providers.gradleProperty('backendHost').isPresent())
    if(providers.gradleProperty('backendHost').isPresent())doLast {
        def target=file("${destinationDir}/META-INF/neoforge.mods.toml")
        def lab=rootProject.file('backend-lab/src/main/resources/META-INF/neoforge.mods.toml').getText('UTF-8')
        def host=rootProject.file('mod/src/main/resources/META-INF/neoforge.mods.toml').getText('UTF-8').replace('${version}','0.3.2-experimental')
        target.setText(lab+'\n'+host.substring(host.indexOf('[[mods]]')),'UTF-8')
    }
}
